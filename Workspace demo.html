<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tzak Tzak</title>
<style>
:root{--bg:#f0ede8;--bar:#fbf9f5;--card:#fbf9f5;--col:#e6e2db;--line:#dcd7cd;--ink:#33261c;--mute:#7c6b58;--acc:#9a5b2e;--sel:#e8e3d9;
--side:#160e08;--side-ink:#f0e6d6;--side-mute:#a08d78;--side-sel:#2c1e14;--radius:14px;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--acc)}
aside{width:220px;flex:none;background:var(--side);color:var(--side-ink);padding:16px 10px;display:flex;flex-direction:column;min-height:0}
aside h2{font-size:13px;color:var(--side-mute);font-weight:600;margin:0 8px 8px}
aside button{display:block;width:100%;text-align:left;padding:8px;border-radius:calc(var(--radius) - 4px)}
aside button:focus-visible{outline-color:var(--side-ink)}
aside button.on{background:var(--side-sel)}
aside .side-scroll{flex:1;min-height:0;overflow:auto}
.side-foot{margin-top:auto;padding-top:8px;border-top:1px solid color-mix(in srgb,var(--side-ink) 10%,transparent)}
.side-foot .bm{color:var(--side-mute)}
.side-foot .bm:hover{color:var(--side-ink);background:var(--side-sel)}
.side-foot .bm span:first-child{color:inherit}
.brand{padding:10px 8px 4px}
.brand b{display:block;font-size:13px;font-weight:650;letter-spacing:.01em;color:var(--side-ink)}
.brand span{display:block;font-size:11px;color:var(--side-mute);margin-top:2px}
main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--side);min-height:0}
main.global-view{background:var(--side)}
.stage{flex:1;min-height:0;min-width:0;display:flex;flex-direction:column;margin:0 8px 8px 0;border-radius:0 var(--radius) var(--radius) var(--radius);overflow:hidden}
main.global-view .stage{margin:8px 8px 8px 0;border-radius:var(--radius)}
main.global-view #view{margin:0;border-radius:0;overflow:hidden;background:var(--bg);flex:1;min-height:0}
#bar{--tab:var(--bar);background:var(--side);display:flex;align-items:flex-end;gap:0;padding:8px 12px 0 0;overflow-x:auto;min-height:40px;flex:none}
#tabs{display:flex;align-items:flex-end;gap:6px;min-width:0;flex:1;padding-right:8px}
#bar .tab{position:relative;z-index:1;display:inline-flex;align-items:center;gap:7px;flex:none;margin:0;padding:8px 14px 9px;white-space:nowrap;color:color-mix(in srgb,#fff 78%,transparent);font-size:13px;font-weight:500;letter-spacing:.01em;background:color-mix(in srgb,var(--c) 42%,#1c120c);border-radius:var(--radius) var(--radius) 0 0;transition:background .15s ease,color .15s ease}
#bar .tab svg{flex:none;opacity:.85}
#bar .tab:hover{z-index:2;color:#fff;background:color-mix(in srgb,var(--c) 62%,#1c120c)}
#bar .tab.on{z-index:3;color:#fff;background:var(--c);padding-bottom:11px;margin-bottom:-1px}
#bar .tab.on svg{opacity:1}
#bar .tab:focus-visible{outline:none;color:#fff;background:color-mix(in srgb,var(--c) 75%,#fff)}
#bar .actions{display:flex;align-items:center;margin-left:auto;padding:0 2px 6px;flex:none}
#settings{display:grid;place-items:center;width:32px;height:32px;border-radius:calc(var(--radius) - 4px);color:var(--side-mute);transition:background .15s,color .15s}
#settings:hover{color:var(--side-ink);background:var(--side-sel)}
#settings:focus-visible{outline-color:var(--side-ink)}
#bar .tab.add{--c:#5a4a3c;color:var(--side-mute);padding-left:14px;padding-right:14px;font-weight:600}
#bar .tab.add:hover{color:var(--side-ink)}
#menu{position:fixed;z-index:5;background:var(--bar);border:1px solid var(--line);border-radius:var(--radius);padding:6px;display:none;box-shadow:0 8px 28px #00000022;min-width:240px}
#menu button{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;padding:8px 10px;border-radius:calc(var(--radius) - 4px)}
#menu button:hover{background:var(--sel)}
#menu button:disabled{opacity:.45;cursor:default;pointer-events:none}
#menu button:disabled:hover{background:transparent}
#menu .mi{display:grid;flex:none;width:28px;height:28px;border-radius:calc(var(--radius) - 6px);place-items:center;color:#fff}
#menu .mi svg{display:block}
#menu .mt{display:flex;flex-direction:column;gap:1px;min-width:0}
#menu .mt b{font-size:13px;font-weight:600;color:var(--ink)}
#menu .mt span{font-size:12px;color:var(--mute);font-weight:400}
#view{flex:1;min-height:0}
#view.db,#view.mod{display:flex;flex-direction:column;align-items:stretch;text-align:left;padding:0;font-size:15px;color:var(--ink);flex:1;min-height:0;margin:0;border-radius:0 var(--radius) var(--radius) var(--radius);overflow:hidden;background:var(--bg)}
#view.mod{place-items:unset}
#view.cover-view{background:var(--tab)}
.vbar,.modbar{background:var(--tab,var(--bar));display:flex;align-items:center;gap:4px;padding:7px 14px;min-height:42px;border-bottom:none;box-shadow:inset 0 -1px 0 color-mix(in srgb,#000 12%,transparent)}
.modbar .bedit{margin-left:auto;display:grid;place-items:center;width:32px;height:32px;padding:0;border-radius:calc(var(--radius) - 4px);color:color-mix(in srgb,#fff 78%,transparent);transition:background .12s,color .12s}
.modbar .bedit svg{display:block}
.modbar .bedit:hover{color:#fff;background:color-mix(in srgb,#fff 14%,transparent)}
.modbar .bedit.on{color:#fff;background:color-mix(in srgb,#fff 22%,transparent)}
.modbar .done-toggle{margin-left:auto;display:inline-flex;align-items:center;height:32px;padding:0 12px;border-radius:calc(var(--radius) - 4px);color:color-mix(in srgb,#fff 78%,transparent);font-size:13px;font-weight:500;white-space:nowrap;transition:background .12s,color .12s}
.modbar .done-toggle:hover{color:#fff;background:color-mix(in srgb,#fff 14%,transparent)}
.modbar .done-toggle.on{color:#fff;background:color-mix(in srgb,#fff 22%,transparent)}
.modbar .done-toggle+.bedit{margin-left:0}
.col.done-col{background:color-mix(in srgb,var(--sel) 55%,#fff)}
.col.done-col .col-head{background:color-mix(in srgb,var(--sel) 80%,#fff)}
.col.done-col .done-empty{padding:16px 8px;text-align:center;color:var(--mute);font-size:13px}
.col-name-input{font:inherit;font-size:13px;font-weight:600;color:var(--ink);text-align:center;background:#fff;border:1px solid var(--line);border-radius:calc(var(--radius) - 4px);padding:4px 8px;width:100%;min-width:0;flex:1;box-sizing:border-box}
.col-name-input:focus{outline:2px solid color-mix(in srgb,var(--acc) 35%,transparent);outline-offset:1px;border-color:color-mix(in srgb,var(--acc) 40%,var(--line))}
.col-move{flex:none;width:28px;height:28px;display:grid;place-items:center;border-radius:calc(var(--radius) - 6px);color:var(--mute);font-size:16px;line-height:1;cursor:pointer}
.col-move:hover:not(:disabled){color:var(--ink);background:color-mix(in srgb,var(--ink) 8%,transparent)}
.col-move:disabled{opacity:.28;cursor:default}
.board.editing .col-head{cursor:default;background:var(--sel);gap:4px;padding:8px 8px}
.board.editing .col-head:hover{color:var(--mute);background:var(--sel)}
.modbar.gbar{gap:8px;color:#fff;font-weight:600}
.modbar.gbar span{display:flex}
.modbar.gbar b{font-size:14px;font-weight:600;letter-spacing:.01em}
.vbar button{padding:5px 11px;border-radius:999px;color:color-mix(in srgb,#fff 72%,transparent);font-size:13px;font-weight:500;white-space:nowrap;transition:background .12s,color .12s}
.vbar button:hover{color:#fff;background:color-mix(in srgb,#fff 12%,transparent)}
.vbar .on{background:color-mix(in srgb,#fff 20%,transparent);color:#fff}
.vbar .vadd{color:#fff;font-weight:600;opacity:.88}
.vbar .vadd:hover{opacity:1}
.modbar .url{flex:1;min-width:0;font:inherit;font-size:13px;color:#fff;background:color-mix(in srgb,#000 18%,transparent);border:0;border-radius:999px;padding:6px 12px;outline:none}
.modbar .url::placeholder{color:color-mix(in srgb,#fff 55%,transparent)}
.modbar .url:focus{background:color-mix(in srgb,#000 28%,transparent)}
.frame{flex:1;min-height:0;border:0;width:100%;background:#fff}
.chat{flex:1;min-height:0;display:flex;background:var(--card)}
.ch-side{width:200px;flex:none;align-self:stretch;background:var(--col);padding:12px 8px;display:flex;flex-direction:column;gap:2px;border-right:1px solid var(--line);overflow:auto}
.ch-side h4{margin:0 8px 6px;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--mute)}
.ch-side button{display:block;width:100%;text-align:left;padding:6px 8px;border-radius:calc(var(--radius) - 4px);color:var(--ink);font-size:13px}
.ch-side button:hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}
.ch-side button.on{background:color-mix(in srgb,var(--ink) 10%,transparent)}
.ch-side .ch-add{color:var(--mute);margin-top:4px}
.ch-main{flex:1;min-width:0;display:flex;flex-direction:column}
.ch-head{padding:12px 16px;border-bottom:1px solid var(--line);font-weight:600;font-size:15px}
.ch-head span{color:var(--mute);font-weight:500;margin-right:2px}
.ch-msgs{flex:1;overflow:auto;padding:12px 16px;display:flex;flex-direction:column;gap:14px}
.ch-msg b{display:block;font-size:13px;margin-bottom:2px}
.ch-msg p{margin:0;font-size:14px;color:var(--ink)}
.ch-msg time{font-size:11px;color:var(--mute);font-weight:400;margin-left:8px}
.log{flex:1;overflow:auto;padding:16px 20px;display:flex;flex-direction:column;gap:10px}
.log .entry{display:grid;grid-template-columns:88px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.log .entry time{font-size:12px;color:var(--mute);padding-top:2px}
.log .entry p{margin:0;font-size:14px}
.log .add{align-self:flex-start;color:var(--acc);font-weight:600;padding:6px 0}
.wrap{position:relative}
.pop{display:none;position:absolute;top:100%;left:0;z-index:2;background:var(--card);border:1px solid var(--line);border-radius:calc(var(--radius) - 4px);padding:4px;box-shadow:0 4px 16px #0002}
.pop button{display:block;width:100%;text-align:left;color:var(--ink)}
.scroll{overflow:auto;padding:12px;flex:1}
table{border-collapse:collapse;width:100%;min-width:480px}
th{font-weight:500;color:var(--mute);text-align:left;font-size:13px}
th.addcol{cursor:pointer;white-space:nowrap;color:var(--acc)}
th.addcol:hover{color:var(--ink)}
th,td{border-bottom:1px solid var(--line);padding:6px 8px}
td+td,th+th{border-left:1px solid var(--line)}
td:focus{outline:2px solid var(--acc);outline-offset:-2px}
.new{color:var(--mute);cursor:pointer}.new:hover{background:var(--sel)}
select{font:inherit;color:inherit;background:var(--sel);border:0;border-radius:4px;padding:2px 6px}
.board{display:flex;gap:0;padding:0;overflow-x:auto;overflow-y:hidden;flex:1;align-items:stretch;background:#fff;min-height:0;width:100%}
.mb{flex:1;min-height:0;display:flex;flex-direction:column}
.mb-foot{display:flex;flex:none;border-top:1px solid var(--line)}
.mb-foot button{flex:1;min-width:0;padding:14px 10px;font-size:13px;text-align:center;border-radius:0;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:opacity .15s}
.mb-foot button.off{text-decoration:line-through;opacity:.45}
.card.tint{border-color:color-mix(in srgb,var(--pc) 25%,var(--line))}
.col{flex:1 1 240px;min-width:240px;width:auto;display:flex;flex-direction:column;min-height:0;align-self:stretch;background:#fff;border-radius:0;padding:0;border-left:1px solid var(--line)}
.col:first-child{border-left:0}
.col-head{display:flex;align-items:center;justify-content:center;gap:6px;flex:none;width:100%;margin:0;padding:12px 14px 10px;font:inherit;font-size:13px;font-weight:600;color:var(--mute);text-align:center;cursor:pointer;background:var(--sel);border-bottom:1px solid var(--line);border-radius:0}
.col-head:hover{color:var(--ink);background:color-mix(in srgb,var(--sel) 70%,#fff)}
.col-head .col-name{min-width:0}
.col:not(.collapsed) .col-count{display:none}
.col-body{flex:1;min-height:0;overflow-y:auto;padding:10px 14px 12px;display:flex;flex-direction:column}
.col.collapsed{flex:0 0 44px;min-width:44px;width:44px;background:#fff}
.col.collapsed .col-head{flex:1;flex-direction:column;justify-content:flex-start;align-items:center;padding:0;gap:0;height:100%;background:transparent;border-bottom:0}
.col.collapsed .col-count{display:grid;place-items:center;flex:none;order:1;width:100%;height:40px;font-size:13px;font-weight:600;color:var(--ink);background:var(--sel);border-bottom:1px solid var(--line)}
.col.collapsed .col-name{order:2;writing-mode:vertical-rl;text-orientation:mixed;letter-spacing:.08em;text-transform:uppercase;font-size:12px;padding:14px 0 8px;color:var(--mute)}
.col.collapsed .col-body{display:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;margin-bottom:8px;cursor:grab}
.card b,.card span{display:block}.card span{color:var(--mute);font-size:13px}
.card b{display:flex;align-items:center;gap:8px;min-width:0;width:100%}
.card .card-check{flex:none;width:16px;height:16px;margin:0;accent-color:var(--acc);cursor:pointer}
.card .card-name{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:inherit;font-size:inherit;font-weight:inherit}
.card.done .card-name{text-decoration:line-through;opacity:.72}
.card .src{font-size:12px;color:var(--mute);margin-top:4px}
.day-group{margin:0 0 10px}
.day-group:first-child{margin-top:2px}
.day-title{margin:0 0 8px;padding:2px 2px 0;font-size:12px;font-weight:600;color:var(--mute);letter-spacing:.02em}
.card .unpin{float:right;color:var(--mute);font-size:12px;padding:0 2px;opacity:0}
.card:hover .unpin{opacity:1}
.pick{max-height:240px;overflow:auto;min-width:220px}
.pick button{font-size:13px}
.pick small{display:block;color:var(--mute);font-size:11px}
.addc{color:var(--mute);width:100%;text-align:center;padding:6px;border-radius:calc(var(--radius) - 4px)}.addc:hover{background:var(--sel)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;padding:12px;overflow:auto;flex:1;align-content:start}
.gcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;padding-bottom:10px}
.gcard>:not(.cover){display:block;margin:6px 12px 0}
.gcard span{color:var(--mute);font-size:13px}
.gcard em{font-style:normal;font-size:12px;background:var(--sel);border-radius:4px;padding:2px 6px;width:fit-content}
.cover{height:90px;display:grid;place-items:center;font-size:32px;font-weight:600;background:var(--sel);color:var(--acc)}
.cover-page{flex:1;min-height:0;overflow:auto;background:var(--tab);padding:36px 40px 48px;color:#fff}
.cover-page h1{margin:0 0 28px;font-size:32px;font-weight:650;letter-spacing:-.02em;color:#fff;max-width:640px}
.cover-rows{display:flex;flex-direction:column;gap:14px;max-width:640px}
.cover-row{display:grid;grid-template-columns:140px 1fr;gap:12px;align-items:start}
.cover-row label{font-size:13px;font-weight:600;color:color-mix(in srgb,#fff 72%,transparent);padding-top:8px}
.cover-row input,.cover-row textarea{font:inherit;color:#fff;background:color-mix(in srgb,#000 18%,transparent);border:1px solid color-mix(in srgb,#fff 18%,transparent);border-radius:calc(var(--radius) - 4px);padding:7px 10px;width:100%;box-sizing:border-box}
.cover-row textarea{min-height:88px;resize:vertical;line-height:1.45}
.cover-row input::placeholder,.cover-row textarea::placeholder{color:color-mix(in srgb,#fff 45%,transparent)}
.cover-row input:focus,.cover-row textarea:focus{outline:2px solid color-mix(in srgb,#fff 40%,transparent);outline-offset:1px;border-color:color-mix(in srgb,#fff 35%,transparent);background:color-mix(in srgb,#000 26%,transparent)}
.cover-row input[type="date"]::-webkit-calendar-picker-indicator{filter:invert(1);opacity:.7}
.cover-add{position:relative;margin-top:18px;width:fit-content}
.cover-add>button{color:color-mix(in srgb,#fff 78%,transparent);font-weight:600;font-size:13px;padding:6px 10px;border-radius:calc(var(--radius) - 4px)}
.cover-add>button:hover{background:color-mix(in srgb,#fff 14%,transparent);color:#fff}
.cover-add .pop{min-width:180px}
.cover-add .pop button{padding:8px 10px}
.cover-add .pop small{margin-top:2px}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:40px 24px;text-align:center}
.empty h2{margin:0;font-size:20px;font-weight:600;color:var(--ink)}
.empty p{margin:0 0 12px;font-size:14px;color:var(--mute);max-width:340px;line-height:1.45}
.empty .cta{font:inherit;color:#fff;background:var(--acc);border:0;border-radius:var(--radius);padding:10px 16px;cursor:pointer}
aside small{display:block;color:var(--mute);font-size:12px;font-weight:400}
.bm{display:flex;align-items:center;gap:8px}
.bm span:first-child{display:flex;flex:none}
.bm span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.none{color:var(--side-mute);font-size:13px;margin:0 8px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:10;padding:16px}
.dlg{background:var(--card);border:1px solid var(--line);border-radius:calc(var(--radius) + 4px);width:min(440px,100%);padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 12px 40px #0006;transition:background .15s ease,border-color .15s ease}
.dlg.tint{background:color-mix(in srgb,var(--pc) 32%,#fff);border-color:color-mix(in srgb,var(--pc) 25%,var(--line))}
.dlg .props{display:flex;flex-direction:column;gap:2px}
.dlg .prop{display:grid;grid-template-columns:148px 1fr;gap:8px;align-items:center;min-height:34px;margin:0;font-size:13px;color:var(--mute)}
.dlg .prop>span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dlg .prop>:last-child{min-width:0;width:100%}
.dlg input,.dlg select,.dlg .ptab-btn{font:inherit;color:var(--ink);background:transparent;border:1px solid transparent;border-radius:calc(var(--radius) - 4px);padding:6px 8px;width:100%;box-sizing:border-box}
.dlg input:hover,.dlg select:hover,.dlg .ptab-btn:hover{background:color-mix(in srgb,var(--ink) 5%,transparent)}
.dlg input:focus,.dlg select:focus,.dlg .ptab-btn:focus{outline:none;background:color-mix(in srgb,#fff 55%,transparent);border-color:color-mix(in srgb,var(--ink) 12%,transparent)}
.dlg.tint input:focus,.dlg.tint select:focus,.dlg.tint .ptab-btn:focus{background:color-mix(in srgb,#fff 72%,transparent)}
.dlg input.title{font-size:20px;font-weight:600;border:0;padding:0;background:transparent;width:100%}
.dlg.tint input.title,.dlg input.title:hover,.dlg input.title:focus{background:transparent;border-color:transparent}
.dlg input.title:focus{outline:none}
.dlg select{cursor:pointer;appearance:none;background-image:none}
.dlg .ptab{position:relative;width:100%}
.dlg .ptab-btn{display:inline-flex;align-items:center;gap:8px;text-align:left;cursor:pointer;max-width:100%}
.dlg .ptab-btn .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dlg .dot{width:10px;height:10px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px #0002}
.dlg .ptab .pop{left:0;right:auto;min-width:min(280px,100%);max-height:240px;overflow:auto}
.dlg .ptab .pop button{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;font-size:13px}
.dlg .ptab .pop button.on{background:var(--sel)}
.dlg .desc{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.dlg .desc>span{font-size:13px;color:var(--mute)}
.dlg textarea{font:inherit;color:var(--ink);background:transparent;border:1px solid transparent;border-radius:calc(var(--radius) - 4px);padding:8px;width:100%;min-height:140px;resize:vertical;line-height:1.45;box-sizing:border-box}
.dlg textarea:hover{background:color-mix(in srgb,var(--ink) 5%,transparent)}
.dlg textarea:focus{outline:none;background:color-mix(in srgb,#fff 55%,transparent);border-color:color-mix(in srgb,var(--ink) 12%,transparent)}
.dlg.tint textarea:focus{background:color-mix(in srgb,#fff 72%,transparent)}
.dlg textarea::placeholder{color:var(--mute)}
.x{align-self:flex-end;padding:6px 14px;border-radius:calc(var(--radius) - 4px);background:var(--sel)}
.dlg.tint .x{background:color-mix(in srgb,#fff 55%,transparent)}
td.open{width:1%}.open button{color:var(--acc);font-size:13px}
.card,.gcard{cursor:pointer}
@media(max-width:600px){aside{width:130px}}
</style>
</head>
<body>
<aside>
  <div class="side-scroll">
    <h2>Globals</h2><div id="globals"></div>

<script>
const STAGES=["Backlog","This week","Today","Tomorrow","Next week"];
let stages=STAGES.slice();
function loadStages(list){
  if(!list||!list.length)return;
  stages=list.map(s=>typeof s==="string"?s:s.name).filter(Boolean);
}
const TYPES=[
 {t:"Board",title:"Board",sub:"Kanban columns and cards"},
 {t:"Database",title:"Database",sub:"Tables and structured records"},
 {t:"Files",title:"Files",sub:"Assets, kits, and uploads",off:true},
 {t:"Docs",title:"Docs",sub:"Knowledge base notes and briefs",off:true},
 {t:"Links",title:"Links",sub:"Stakeholders and key references",off:true},
 {t:"Chat",title:"Chat",sub:"Communication channels and threads",off:true},
 {t:"Iframe",title:"Iframe",sub:"Embed Google Docs and pages",off:true},
 {t:"Changelog",title:"Changelog",sub:"Release notes and product updates",off:true},
 {t:"Workflows",title:"Workflows",sub:"Trigger remote workers",off:true}
];
let folders=[],p=0,m=0,g="Masterboard";
const LAST_TAB_KEY="projectoire:lastTab";
const SESSION_KEY="projectoire:session";
function loadLastTabs(){
  try{return JSON.parse(localStorage.getItem(LAST_TAB_KEY)||"{}")||{}}catch{return{}}
}
function saveLastTab(slug,tabSlug){
  if(!slug||!tabSlug)return;
  const map=loadLastTabs();
  map[slug]=tabSlug;
  try{localStorage.setItem(LAST_TAB_KEY,JSON.stringify(map))}catch{}
}
function rememberCurrentTab(){
  const pr=folders[p];
  const mod=pr?.mods?.[m];
  if(pr&&mod?.[2]?.slug)saveLastTab(pr.slug,mod[2].slug);
}
function restoreTabIndex(pr){
  if(!pr?.mods?.length)return 0;
  const want=loadLastTabs()[pr.slug];
  if(!want)return 0;
  const i=pr.mods.findIndex(mod=>mod[2]?.slug===want);
  return i>=0?i:0;
}
function loadSession(){
  try{return JSON.parse(localStorage.getItem(SESSION_KEY)||"null")}catch{return null}
}
function rememberSession(){
  try{
    localStorage.setItem(SESSION_KEY,JSON.stringify({
      g:g||null,
      project:folders[p]?.slug||null
    }));
  }catch{}
  if(!g)rememberCurrentTab();
}
const $=id=>document.getElementById(id);

function fromApi(data){
  if(data.stages&&data.stages.length)loadStages(data.stages);
  return (data.projects||[]).map(pr=>{
    const cover=pr.cover||{fields:["created"],values:{created:new Date().toISOString().slice(0,10),deadline:"",goal:"",description:""}};
    const mods=[["Cover","Cover",{slug:"cover",fields:cover.fields.slice(),values:Object.assign({created:"",deadline:"",goal:"",description:""},cover.values)}]];
    (pr.databases||[]).forEach(d=>{
      mods.push(["Database",d.name,{
        slug:d.slug,
        cols:(d.columns||[]).map(c=>({id:c.id,label:c.label,type:c.type||"text"})),
        cur:0,
        views:[{n:"Table",t:"table"},{n:"Gallery",t:"gallery"}],
        rows:(d.items||[]).map(it=>{
          const row={slug:it.slug,body:it.body||""};
          Object.assign(row,it.fields||{});
          return row;
        })
      }]);
    });
    (pr.boards||[]).forEach(b=>{
      mods.push(["Board",b.name,{
        slug:b.slug,
        columns:b.columns&&b.columns.length?b.columns:stages.slice(),
        rows:(b.cards||[]).map(c=>{
          const msRaw=c.master||c.status;
          const ms=stages.includes(msRaw)?msRaw:(stages.includes(c.status)?c.status:stages[0]);
          return{n:c.title,s:c.status,ms,slug:c.slug,doneAt:c.doneAt||"",body:c.body||""};
        })
      }]);
    });
    return {slug:pr.slug,name:pr.name,color:pr.color||"#9a5b2e",mods};
  });
}
function boardKey(folder,mod){return folder.slug+"/"+(mod[2]?.slug||mod[1])}
async function reload(){
  const data=await fetch("/api/workspace").then(r=>r.json());
  const initial=!folders.length;
  const keepP=folders[p]?.slug,keepM=folders[p]?.mods[m]?.[2]?.slug,keepG=g;
  folders=fromApi(data);
  if(initial){
    const sess=loadSession();
    if(sess&&("g" in sess))g=sess.g||null;
    else g="Masterboard";
    if(sess?.project){
      const pi=folders.findIndex(f=>f.slug===sess.project);
      p=pi>=0?pi:0;
    }else p=0;
    m=restoreTabIndex(folders[p]);
  }else{
    p=Math.max(0,folders.findIndex(f=>f.slug===keepP));
    if(p<0)p=0;
    m=Math.max(0,(folders[p]?.mods||[]).findIndex(mod=>mod[2]?.slug===keepM));
    if(m<0)m=0;
    g=keepG;
  }
  render();
}
async function saveCard(row,folder,mod){
  if(!folder||!mod||mod[0]!=="Board")return;
  const data=await fetch("/api/card",{
    method:"PUT",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      project:folder.slug,
      board:mod[2].slug,
      slug:row.slug,
      title:row.n||"Untitled",
      status:row.s||(mod[2].columns||stages)[0]||stages[0],
      master:row.ms||stages[0],
      doneAt:row.doneAt||"",
      body:row.body||""
    })
  }).then(r=>r.json());
  const keepP=folder.slug,keepM=mod[2].slug,keepG=g;
  folders=fromApi(data);
  p=Math.max(0,folders.findIndex(f=>f.slug===keepP));
  if(p<0)p=0;
  m=Math.max(0,(folders[p]?.mods||[]).findIndex(x=>x[2]?.slug===keepM));
  if(m<0)m=0;
  g=keepG;
  return data;
}
async function deleteCard(folder,mod,slug){
  if(!folder||!mod||mod[0]!=="Board"||!slug)return;
  await fetch("/api/card",{
    method:"DELETE",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({project:folder.slug,board:mod[2].slug,slug})
  });
}
async function moveCard(row,from,to){
  if(!from||!to||from.mod[0]!=="Board"||to.mod[0]!=="Board")return;
  const same=from.folder.slug===to.folder.slug&&from.mod[2].slug===to.mod[2].slug;
  if(same){await saveCard(row,to.folder,to.mod);return}
  const cols=to.mod[2].columns||stages;
  if(!cols.includes(row.s))row.s=cols[0]||stages[0];
  if(!stages.includes(row.ms))row.ms=stages[0];
  const oldSlug=row.slug;
  let slug=oldSlug||slugifyClient(row.n||"Untitled");
  const taken=new Set((to.mod[2].rows||[]).map(r=>r.slug));
  if(taken.has(slug)){
    let i=2,base=slugifyClient(row.n||"Untitled");
    while(taken.has(base+"-"+i))i++;
    slug=base+"-"+i;
  }
  row.slug=slug;
  from.mod[2].rows=(from.mod[2].rows||[]).filter(r=>r!==row);
  if(!to.mod[2].rows)to.mod[2].rows=[];
  if(!to.mod[2].rows.includes(row))to.mod[2].rows.push(row);
  await saveCard(row,to.folder,to.mod);
  await deleteCard(from.folder,from.mod,oldSlug);
}
function slugifyClient(s){
  return String(s||"").toLowerCase().trim().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"item";
}
async function createCard(folder,mod,title,status){
  const boardCol=status||(mod[2].columns||stages)[0];
  const res=await fetch("/api/card",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      project:folder.slug,
      board:mod[2].slug,
      title,
      status:boardCol,
      master:stages[0],
      body:""
    })
  });
  const data=await res.json();
  folders=fromApi(data);
  return data.slug;
}
async function saveItem(row,folder,mod){
  if(!folder||!mod||mod[0]!=="Database")return;
  const fields={};
  (mod[2].cols||[]).forEach(c=>{fields[c.id]=row[c.id]!=null?row[c.id]:""});
  await fetch("/api/item",{
    method:"PUT",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      project:folder.slug,
      database:mod[2].slug,
      slug:row.slug,
      fields,
      body:row.body||""
    })
  });
}
async function saveDbSchema(folder,mod){
  if(!folder||!mod||mod[0]!=="Database")return;
  await fetch("/api/database",{
    method:"PUT",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      project:folder.slug,
      database:mod[2].slug,
      name:mod[1],
      columns:mod[2].cols
    })
  });
}
async function createItem(folder,mod,fields){
  const res=await fetch("/api/item",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      project:folder.slug,
      database:mod[2].slug,
      fields
    })
  });
  const data=await res.json();
  folders=fromApi(data);
  return data.slug;
}
function render(){
  if(!folders.length){
    $("folders").innerHTML="";
    $("view").className="mod";
    $("view").innerHTML="<div style='padding:24px;color:var(--mute)'>Loading projects…</div>";
    globals();
    return;
  }
  $("folders").innerHTML="";
  folders.forEach((pr,i)=>{
    const b=document.createElement("button");
    b.className="bm"+(i===p&&!g?" on":"");
    const ic=el("span");ic.innerHTML=icon("folder");ic.style.color=pr.color||PC[i%PC.length];
    b.append(ic,el("span","",pr.name));
    b.onclick=()=>{g=null;p=i;m=restoreTabIndex(folders[i]);boardEdit=false;render()};
    $("folders").append(b);
  });
  if(g){
    const c=GACC;
    $("bar").style.display="none";
    document.querySelector("main").classList.add("global-view");
    if(g==="Masterboard")renderMasterBoard(c);
    else if(g==="Calendar")renderCalendar(c);
    else{
      $("view").className="mod";$("view").style.setProperty("--tab",c);$("view").innerHTML="";
      $("view").append(globalBar(g),Object.assign(el("div","", "This is the "+g.toLowerCase()+" page."),{style:"padding:20px;color:var(--mute);font-size:18px;text-align:center"}));
    }
    rememberSession();
    globals();return;
  }
  document.querySelector("main").classList.remove("global-view");
  $("bar").style.display="";
  const mods=folders[p].mods;
  const x=mods[m];
  const projC=folders[p].color||PC[p%PC.length];
  const tabC=projC;
  $("bar").style.setProperty("--tab",tabC);
  $("bar").innerHTML="";
  const tabs=el("div");tabs.id="tabs";
  mods.forEach((mod,i)=>{
    const b=tabBtn(mod[1],projC,i===m,mod[0]);
    b.onclick=()=>{m=i;render()};
    tabs.append(b);
  });
  const add=el("button","tab add","+");
  add.id="add";add.title="Add tab";
  add.onclick=e=>{
    e.stopPropagation();
    const menu=$("menu"),r=add.getBoundingClientRect();
    menu.style.left=Math.min(r.left,innerWidth-160)+"px";
    menu.style.top=r.bottom+4+"px";
    menu.style.display="block";
  };
  tabs.append(add);
  $("bar").append(tabs);
  const actions=el("div","actions");
  const set=el("button");
  set.id="settings";set.title="Project settings";set.innerHTML=icon("settings");
  actions.append(set);
  $("bar").append(actions);
  if(x&&x[0]==="Cover"){boardEdit=false;renderCover(folders[p],x,tabC)}
  else if(x&&x[0]==="Board")renderBoard(x,tabC);
  else if(x&&x[0]==="Database"){boardEdit=false;renderDb(x,tabC)}
  else{
    boardEdit=false;
    $("view").className="mod";
    $("view").style.setProperty("--tab",tabC);
    $("view").innerHTML="";
    $("view").append(el("div","modbar"));
    const msg=el("div","",x?`This is a ${x[0].toLowerCase()} tab.`:"No boards yet. Add one.");
    msg.style.cssText="padding:20px;color:var(--mute);font-size:18px;text-align:center";
    $("view").append(msg);
  }
  rememberSession();
  globals();
}
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x)e.textContent=x;return e};
const tabBtn=(label,c,on,type)=>{
  const b=el("button","tab"+(on?" on":""));
  b.style.setProperty("--c",c);
  if(type&&IC[type]){const i=el("span");i.innerHTML=icon(type);b.append(i)}
  b.append(document.createTextNode(label));
  return b;
};

  const b=el("button");

    });

function globalBar(name){
  const bar=el("div","modbar gbar");
  const i=el("span");i.innerHTML=icon(name);
  bar.append(i,el("b","",name));
  return bar;
}
function boardEditBtn(){
  const edit=el("button","bedit"+(boardEdit?" on":""));
  edit.type="button";
  edit.title=boardEdit?"Done editing":"Edit board";
  edit.setAttribute("aria-label",edit.title);
  edit.innerHTML=icon("pencil");
  edit.onclick=()=>{boardEdit=!boardEdit;render()};
  return edit;
}
function isDone(row){return !!(row&&row.doneAt)}
function dayKey(iso){
  const d=new Date(iso);
  if(Number.isNaN(d.getTime()))return"unknown";
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function dayTitle(iso){
  const d=new Date(iso);
  if(Number.isNaN(d.getTime()))return"Unknown date";
  return d.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric",year:"numeric"});
}
function groupByDoneDay(rows){
  const map=new Map();
  rows.slice().sort((a,b)=>String(b.doneAt).localeCompare(String(a.doneAt))).forEach(r=>{
    const key=dayKey(r.doneAt);
    if(!map.has(key))map.set(key,{key,title:dayTitle(r.doneAt),rows:[]});
    map.get(key).rows.push(r);
  });
  return [...map.values()];
}
function cardTitle(name,row,folder,mod){
  const b=el("b");
  const check=document.createElement("input");
  check.type="checkbox";
  check.className="card-check";
  check.checked=isDone(row);
  check.title=isDone(row)?"Mark active":"Mark completed";
  check.onclick=e=>e.stopPropagation();
  check.onchange=async e=>{
    e.stopPropagation();
    // Keep board/master stage; only toggle doneAt so uncheck restores place.
    row.doneAt=check.checked?new Date().toISOString():"";
    await saveCard(row,folder,mod);
    render();
  };
  b.append(check,el("span","card-name",name||"Untitled"));
  return b;
}
function makeTaskCard(row,folder,mod,opts){
  const pc=opts?.color||folder?.color||PC[0];
  const k=el("div","card tint"+(isDone(row)?" done":""));
  k.draggable=!boardEdit&&!opts?.noDrag;
  k.style.setProperty("--pc",pc);
  k.style.background=pastel(pc);
  k.onclick=()=>{if(!boardEdit)openItem(row)};
  if(!boardEdit&&!opts?.noDrag)k.ondragstart=()=>drag=opts?.dragPayload||row;
  k.append(cardTitle(row.n,row,folder,mod));
  if(opts?.src)k.append(el("span","src",opts.src));
  return k;
}
function completedBtn(scope){
  const on=!!showCompletedByScope.get(scope);
  const btn=el("button","done-toggle"+(on?" on":""));
  btn.type="button";
  btn.textContent=on?"Hide completed":"Show completed";
  btn.title=on?"Hide completed column":"Show completed column";
  btn.setAttribute("aria-pressed",on?"true":"false");
  btn.onclick=()=>{showCompletedByScope.set(scope,!on);render()};
  return btn;
}
function fillDoneGroups(body,items){
  if(!items.length){
    body.append(el("div","done-empty","No completed tasks"));
    return;
  }
  groupByDoneDay(items.map(i=>i.row)).forEach(group=>{
    const wrap=el("div","day-group");
    wrap.append(el("div","day-title",group.title));
    group.rows.forEach(r=>{
      const item=items.find(i=>i.row===r);
      if(!item)return;
      wrap.append(makeTaskCard(r,item.folder,item.mod,{
        color:item.color,
        src:item.src||undefined,
        dragPayload:item.dragPayload
      }));
    });
    body.append(wrap);
  });
}
function appendCompletedCol(boardEl,scope,items,ondrop){
  const col=boardCol("Completed",items.length,scope,ondrop,body=>fillDoneGroups(body,items),{editing:false});
  col.classList.add("done-col");
  boardEl.append(col);
}
function globals(){
  const box=$("globals");box.innerHTML="";
  ["Masterboard","Timelogs","Calendar"].forEach(n=>{
    const k=el("button","bm"+(g===n?" on":"")),i=el("span");
    i.innerHTML=icon(n);i.style.color=GACC;
    k.append(i,el("span","",n));k.onclick=()=>{boardEdit=false;g=n;render()};box.append(k);

function boardCol(s,count,scope,ondrop,fillBody,opts){
  const editing=!!opts?.editing;
  const key=colCollapseKey(scope,s);
  const collapsed=!editing&&colCollapsed.has(key);
  const c=el("div","col"+(collapsed?" collapsed":""));
  if(editing){
    const head=el("div","col-head");
    const left=el("button","col-move","‹");
    left.type="button";left.title="Move left";left.disabled=!opts.canLeft;
    left.onmousedown=e=>e.preventDefault();
    left.onclick=e=>{e.stopPropagation();if(opts.onMove)opts.onMove(s,-1)};
    const right=el("button","col-move","›");
    right.type="button";right.title="Move right";right.disabled=!opts.canRight;
    right.onmousedown=e=>e.preventDefault();
    right.onclick=e=>{e.stopPropagation();if(opts.onMove)opts.onMove(s,1)};
    const input=document.createElement("input");
    input.className="col-name-input";
    input.value=s;
    input.setAttribute("aria-label","Column name");
    let saved=false;
    const commit=async()=>{
      if(saved)return;
      saved=true;
      const next=input.value.trim();
      if(!next||next===s){saved=false;return}
      await opts.onRename(s,next);
    };
    input.onblur=()=>commit();
    input.onkeydown=e=>{
      if(e.key==="Enter"){e.preventDefault();input.blur()}
      if(e.key==="Escape"){input.value=s;input.blur()}
    };
    head.append(left,input,right);
    c.append(head);
  }else{
    const head=el("button","col-head");
    head.type="button";
    head.title=collapsed?"Expand column":"Collapse column";
    head.append(el("span","col-count",String(count)),el("span","col-name",s));
    head.onclick=e=>{
      e.stopPropagation();
      colCollapsed.has(key)?colCollapsed.delete(key):colCollapsed.add(key);
      render();
    };
    c.append(head);
  }
  c.ondragover=e=>e.preventDefault();
  c.ondrop=ondrop;
  if(!collapsed){
    const body=el("div","col-body");
    fillBody(body);
    c.append(body);
  }
  return c;
}

      if(!boardEdit){
        const a=el("button","addc","+ New");
        a.onclick=async()=>{
          const title=(prompt("Task title")||"").trim();
          if(!title)return;
          await createCard(f,md,title,s);
          m=folders[p].mods.findIndex(x=>x[2]?.slug===md[2].slug);
          render();
        };
        body.append(a);
      }
    },{
      editing:boardEdit,
      canLeft:i>0,
      canRight:i<cols.length-1,
      onRename:(from,to)=>renameBoardColumn(f,md,from,to),
      onMove:(name,dir)=>moveBoardColumn(f,md,name,dir)
    }));
  });
  if(showCompletedByScope.get(scope)){
    const doneItems=(d.rows||[]).filter(isDone).map(row=>({
      row,folder:f,mod:md,color:f.color||PC[0],dragPayload:row
    }));
    appendCompletedCol(b,scope,doneItems,async()=>{
      if(!drag||boardEdit)return;
      const row=drag.row||drag;
      if(!isDone(row))row.doneAt=new Date().toISOString();
      drag=null;render();
      await saveCard(row,f,md);
    });
  }
  return b;
}
document.onclick=()=>{$("menu").style.display="none";document.querySelectorAll(".pop").forEach(e=>e.style.display="none")};
reload().catch(err=>{
  $("view").innerHTML=`<div style="padding:24px;color:var(--mute)">Start the app with <code>npm start</code>, then open <code>http://localhost:3456</code>.<br><br>${err}</div>`;
  globals();
});
</script>
</body>
